name: Build LineageOS 15.1 for MS600

# =============================================================================
#  讯飞听见 L1（MS600）LineageOS 15.1（Android 8.1）云编译
#
#  ★ 为什么做 15.1？
#    设备原厂 vendor 是 Android 8.1（API 27），而 18.1 是 Android 11，
#    VNDK 跨 3 代 → 「自编 system + 原厂 vendor」对不上，且 18.1 编译
#    磁盘需求 300GB+，免费 runner 装不下。
#    15.1 与 vendor【版本完全一致】→ 兼容性最好，且体积小得多，
#    有可能在 GitHub 免费 runner 上直接编完（零成本）。
#
#  与 18.1 workflow 的关键差异（不要照搬）：
#    ✗ JDK：15.1 要【JDK 8】，不是 11（22.04 源里没有，需手动补）
#    ✗ Python：15.1 要【Python 2.7】（22.04 源里没有，需手动补）
#    ✗ 源码分支：lineage-15.1，不是 lineage-18.1
#    ✓ 源码体积约 25GB（18.1 是 45GB），磁盘压力小很多
#
#  隔离说明：
#    本文件位于独立的 lineage-15.1 分支，与 main 分支的 18.1 workflow
#    通过 branch + concurrency(group 含 github.ref) 双重隔离，互不干扰。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '编译目标（recoveryimage / bootimage / snod / systemimage / bacon）'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - recoveryimage
          - bootimage
          - snod
          - systemimage
          - bacon
      jobs:
        description: '并行编译任务数（内存吃紧就调小）'
        required: true
        default: '4'
        type: string
      sync_only:
        description: '只同步源码不编译（验证 sync 可行性）'
        required: true
        default: false
        type: boolean
  push:
    # ⚠️ 已【关闭】push 自动触发（2026-10-01 事故）：
    #   原本 branches: [lineage-15.1] + cancel-in-progress: true 的组合，
    #   会导致【任何一次推送】都启一个新 run 并把正在跑的编译顶掉
    #   —— 实测 run #17（已跑 22 分钟）就是这么被 push 顶掉的。
    #   需要自动触发时，用 Actions 页面手动 Run workflow。
    branches-ignore:
      - '**'

concurrency:
  # ⚠️ group 里带 github.ref → 不同分支的运行【天然隔离】，不会互相顶掉。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LineageOS 15.1 / MS600
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      # -----------------------------------------------------------------
      - name: ① 检出本工程
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      - name: ② 探测 Runner 规格
        run: |
          echo "================ CPU ================"
          nproc
          echo "================ 内存 ================"
          free -h
          echo "================ 磁盘（清理前）================"
          df -h /

      # -----------------------------------------------------------------
      - name: ③ 释放磁盘空间（★ 尽力清理）
        run: |
          echo "清理前："; df -h /
          sudo rm -rf /usr/share/dotnet                || true
          sudo rm -rf /usr/local/lib/android           || true
          sudo rm -rf /opt/ghc                         || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL      || true
          sudo rm -rf /usr/local/share/boost           || true
          sudo rm -rf /usr/local/share/powershell      || true
          sudo rm -rf /usr/share/swift                 || true
          sudo rm -rf /usr/local/.ghcup                || true
          sudo rm -rf /usr/local/lib/node_modules      || true
          sudo rm -rf /opt/hostedtoolcache             || true
          sudo rm -rf /usr/share/java                  || true
          sudo rm -rf /usr/share/gradle                || true
          sudo rm -rf /usr/local/share/chromium        || true
          sudo rm -rf /usr/local/share/edge*           || true
          sudo rm -rf /opt/microsoft                   || true
          sudo rm -rf /usr/share/miniconda             || true
          sudo rm -rf /usr/share/R                    || true
          sudo rm -rf /opt/az                          || true
          sudo rm -rf /usr/local/aws-cli               || true
          sudo rm -rf /opt/google/chrome              || true
          sudo rm -rf /usr/lib/firefox                 || true
          sudo rm -rf /usr/share/doc                   || true
          sudo rm -rf /usr/share/man                   || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*             || true
          sudo docker image prune -a -f                || true
          sudo docker system prune -a -f --volumes     || true
          echo "清理后："; df -h /

      # -----------------------------------------------------------------
      # ★ 15.1 的头号难题：Ubuntu 22.04 官方源里【没有 JDK 8 和 Python 2.7】
      #   解法：
      #     JDK 8   → 用 Adoptium（Eclipse Temurin）官方 apt 源
      #     Python2 → 用 deadsnakes PPA（最可靠的 python2.7 来源）
      - name: ④ 安装 JDK 8（LineageOS 15.1 必需，★ 手动补源）
        run: |
          set -e
          echo "===== 方案 A：Adoptium 官方源装 Temurin 8 ====="
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gpg
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/adoptium.gpg > /dev/null
          echo "deb https://packages.adoptium.net/artifactory/deb $(awk -F= '/^VERSION_CODENAME/{print$2}' /etc/os-release) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          if sudo apt-get install -y temurin-8-jdk; then
            echo "::notice::✅ Temurin 8 安装成功（方案 A）"
          else
            echo "::warning::Adoptium 源失败，改用方案 B：手动解压 tarball"
            cd /opt
            sudo wget -q https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u422-b05/OpenJDK8U-jdk_x64_linux_hotspot_8u422b05.tar.gz -O jdk8.tar.gz
            sudo mkdir -p /opt/jdk8 && sudo tar xzf jdk8.tar.gz -C /opt/jdk8 --strip-components=1
          fi

          # =============================================================
          # ★★ 关键修复（2026-10-01）★★
          #   GitHub runner 预装了 JDK 11，且 /usr/bin/java 优先级更高，
          #   上轮实测：Temurin 8 装成功了，但 `java -version` 仍显示 11。
          #   LineageOS 15.1 必须用 JDK 8 编译 → 这里强制切换默认 Java。
          # =============================================================
          echo "===== 定位 JDK 8 安装路径 ====="
          JDK8=""
          for c in /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/java-8-temurin-amd64 /opt/jdk8; do
            if [ -x "$c/bin/javac" ]; then JDK8="$c"; break; fi
          done
          if [ -z "$JDK8" ]; then
            JDK8=$(find /usr/lib/jvm /opt -maxdepth 3 -type f -name javac 2>/dev/null \
                   | xargs -r grep -l . 2>/dev/null | head -1 | xargs -r dirname | xargs -r dirname || true)
          fi
          echo "JDK8 路径 = ${JDK8:-未找到}"

          if [ -n "$JDK8" ]; then
            # ① update-alternatives 全量接管（java / javac / jar / javadoc ...）
            for b in java javac jar javadoc jarsigner keytool; do
              if [ -x "$JDK8/bin/$b" ]; then
                sudo update-alternatives --install "/usr/bin/$b" "$b" "$JDK8/bin/$b" 1500 2>/dev/null || true
                sudo update-alternatives --set "$b" "$JDK8/bin/$b" 2>/dev/null || true
              fi
            done
            # ② 环境变量兜底（优先级高于 /usr/bin）
            echo "JAVA_HOME=$JDK8" >> $GITHUB_ENV
            echo "$JDK8/bin" >> $GITHUB_PATH
            # ③ 极端兜底：直接覆盖 /usr/bin 下的符号链接（runner 的 JDK11 在 /opt/hostedtoolcache 或 /usr/lib/jvm）
            sudo ln -sf "$JDK8/bin/java"  /usr/local/bin/java  2>/dev/null || true
            sudo ln -sf "$JDK8/bin/javac" /usr/local/bin/javac 2>/dev/null || true
            # ④ 把 runner 预装 JDK11 的 PATH 项从后续步骤里剔除（写入 env 供检查）
            echo "::notice::✅ 默认 Java 已切到 JDK 8：$JDK8"
          else
            echo "::error::❌ 未能定位 JDK 8，编译必失败"
            exit 1
          fi

          echo "===== 校验（★ 必须显示 1.8.0）====="
          export PATH="$JDK8/bin:$PATH"
          java  -version 2>&1 || true
          javac -version 2>&1 || true
          java  -version 2>&1 | grep -q '1\.8\.0' \
            && echo "::notice::✅ java 版本正确 = 1.8.0" \
            || { echo "::error::❌ java 版本仍不是 1.8.0"; exit 1; }

          echo "===== 后续步骤将使用的 java 路径 ====="
          echo "$JDK8/bin" >> $GITHUB_PATH
          which java javac || true

      # -----------------------------------------------------------------
      - name: ⑤ 安装 Python 2.7（LineageOS 15.1 必需，★ 手动补源）
        run: |
          set -e
          echo "===== 方案 A：deadsnakes PPA ====="
          sudo apt-get install -y software-properties-common
          if sudo add-apt-repository -y ppa:deadsnakes/ppa && \
             sudo apt-get update -qq && sudo apt-get install -y python2.7 python2; then
            echo "::notice::✅ python2.7 安装成功（方案 A）"
          else
            echo "::warning::PPA 失败，改用方案 B：手动编译/解压"
            # 退而求其次：用 Ubuntu 20.04 的 python2.7 deb 包
            cd /tmp
            wget -q http://archive.ubuntu.com/ubuntu/pool/main/p/python2.7/libpython2.7-minimal_2.7.18-1~20.04.1_amd64.deb || true
            wget -q http://archive.ubuntu.com/ubuntu/pool/main/p/python2.7/python2.7-minimal_2.7.18-1~20.04.1_amd64.deb || true
            sudo dpkg -i libpython2.7-minimal_*.deb python2.7-minimal_*.deb || true
            sudo apt-get install -fy || true
          fi
          echo "===== 校验 ====="
          python2 --version 2>&1 || python2.7 --version 2>&1 || echo "⚠️ python2 不可用"
          # 建立 python 软链（15.1 的构建脚本调用的是 `python`）
          if command -v python2 >/dev/null 2>&1; then
            sudo ln -sf $(command -v python2) /usr/local/bin/python 2>/dev/null || true
            echo "✅ 已建立 python -> python2 软链"
          fi
          python --version 2>&1 || true

      # -----------------------------------------------------------------
      - name: ⑥ 安装编译依赖（★ 含 15.1 专用旧包）
        run: |
          sudo apt-get update -qq
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
                libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
                lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
                libncurses5-dev libncurses5 lib32ncurses5-dev libtinfo5 \
                libwxgtk3.0-dev lib32stdc++6"
          if ! sudo apt-get install -y $PKGS; then
            echo "::warning::整批安装失败，改为逐个安装"
            for p in $PKGS; do
              sudo apt-get install -y "$p" || echo "::warning::跳过缺失包: $p"
            done
          fi
          # 15.1 编译脚本常需要 `xxd`；libwxgtk3.0 在 22.04 已改名，装不上可忽略

      # -----------------------------------------------------------------
      - name: ⑦ 配置 git 与 repo 工具
        run: |
          git config --global user.name  "MS600 Builder"
          git config --global user.email "builder@ms600.local"
          git config --global color.ui    false
          git config --global core.compression 0

          # ★★★ 国内镜像重写（2026-10-01，与 18.1 线同步）★★★
          #   实测结论（本机复现）：
          #   ① 清华 git/lineageOS/ 【不存在，404】！绝不能把 github.com/LineageOS
          #      重写过去，否则 repo init 直接 "repository not found"。
          #      github.com/LineageOS 直连是【可用】的，保持直连。
          #   ② git config url.X.insteadOf 重复写入【是覆盖不是追加】，必须 --add。
          #   ③ storage.googleapis.com 国内被墙，repo 工具需走清华。
          #   只重写【国内确实连不通】的 googlesource 域名。
          MIRROR_BASE="https://mirrors.tuna.tsinghua.edu.cn/git"

          # ★ 清理历史残留规则，保证幂等（--add 只追加，不清会无限累积）
          echo "===== 清理旧的 url.*.insteadOf 规则 ====="
          for K in $(git config --global --get-regexp 'url\..*\.insteadof' 2>/dev/null \
                     | awk '{print $1}' | sort -u); do
            git config --global --unset-all "$K" 2>/dev/null || true
          done
          echo "  清理后规则数 = $(git config --global --get-regexp 'url\..*\.insteadof' 2>/dev/null | wc -l)"

          echo "===== 探测镜像【真实可用性】（严格 HTTP 200）====="
          probe_strict() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 12 \
                   "$1/info/refs?service=git-upload-pack" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "  ✅ $2 (HTTP $code)"
            else echo "  ❌ $2 (HTTP $code — 不可用)"; fi
          }
          probe_strict "$MIRROR_BASE/AOSP/platform/compatibility/cdd" "AOSP 镜像"
          probe_strict "$MIRROR_BASE/git-repo"                        "git-repo 镜像"

          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://android.googlesource.com/"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://android.googlesource.com"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "git://android.googlesource.com/"
          git config --global --add url."$MIRROR_BASE/git-repo".insteadOf "https://gerrit.googlesource.com/git-repo"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://gerrit.googlesource.com/"

          echo "===== insteadOf 规则（应为 5 条）====="
          git config --global --get-regexp 'url\..*\.insteadof' || true
          N=$(git config --global --get-regexp 'url\..*\.insteadof' | wc -l)
          echo "规则条数 = $N"
          if [ "$N" -lt 5 ]; then
            echo "::error::❌ insteadOf 规则只有 $N 条（期望 5），中止"; exit 1
          fi
          if git config --global --get-regexp 'url\..*\.insteadof' | grep -q 'github.com/LineageOS'; then
            echo "::error::❌ github.com/LineageOS 被重写 —— 清华无此镜像，必失败！"; exit 1
          fi
          echo "  ✅ 确认 github.com 保持直连"

          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.version HTTP/1.1

          # repo 工具：优先清华镜像，官方源兜底（境外 runner 可用）
          mkdir -p ~/bin
          REPO_OK=0
          for R in "$MIRROR_BASE/git-repo" "https://storage.googleapis.com/git-repo-downloads/repo"; do
            echo "尝试拉取 repo 工具: $R"
            if curl -fsSL --connect-timeout 20 "$R" -o ~/bin/repo; then
              chmod a+x ~/bin/repo
              if python3 ~/bin/repo --version >/dev/null 2>&1; then
                echo "::notice::✅ repo 工具就绪（来自 $R）"
                REPO_OK=1; break
              fi
            fi
            echo "  该源不可用，换下一个"
          done
          if [ "$REPO_OK" != "1" ]; then
            echo "::error::❌ 所有 repo 工具源均不可用"
            exit 1
          fi
          echo "$HOME/bin" >> $GITHUB_PATH
          python3 ~/bin/repo --version

      # -----------------------------------------------------------------
      - name: ⑧ 初始化源码仓库（LineageOS 15.1）
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          export PATH="$HOME/bin:$PATH"
          # ★ repo 工具源码在 gerrit.googlesource.com —— 国内 runner 必失败。
          #   统一指定清华镜像的 --repo-url，海外 runner 也可正常使用（更快）。
          REPO_URL_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/git/git-repo"
          repo init -u https://github.com/LineageOS/android.git \
                    -b lineage-15.1 \
                    --repo-url="$REPO_URL_MIRROR" \
                    --git-lfs \
                    --depth=1 \
                    --no-clone-bundle

      # -----------------------------------------------------------------
      - name: ⑨ 同步源码（★ 最耗时）
        run: |
          cd ~/lineage
          export PATH="$HOME/bin:$PATH"
          for i in 1 2 3; do
            echo "===== repo sync 第 $i 次尝试 ====="
            if repo sync -c -j8 --force-sync --no-clone-bundle --no-tags; then
              echo "::notice::repo sync 成功"
              break
            fi
            echo "::warning::repo sync 失败，重试中..."
            sleep 15
          done
          echo "===== 源码体积 ====="
          du -sh ~/lineage 2>/dev/null || true
          df -h /

      # -----------------------------------------------------------------
      - name: ⑩ 放入 MS600 设备树
        run: |
          cd ~/lineage
          mkdir -p device/iflytek/MS600
          cp -rv "$GITHUB_WORKSPACE/device/iflytek/MS600/." device/iflytek/MS600/
          echo "===== 设备树内容 ====="
          find device/iflytek/MS600 -type f | sort

      # -----------------------------------------------------------------
      - name: ⑪ 结束（sync_only 模式）
        if: ${{ github.event.inputs.sync_only == 'true' }}
        run: |
          echo "::notice::sync_only 模式，跳过编译"
          df -h /

      # -----------------------------------------------------------------
      - name: ⑫ 编译（lunch + mka，带磁盘心跳监控）
        if: ${{ github.event.inputs.sync_only != 'true' }}
        run: |
          cd ~/lineage
          # ★ 编译前再钉一次 Java（防止 runner 自身重排 PATH）
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/temurin-8-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "===== 编译环境校验 ====="
          java  -version 2>&1 || true
          javac -version 2>&1 || true
          python --version 2>&1 || true
          if ! java -version 2>&1 | grep -q '1\.8\.0'; then
            echo "::error::❌ 编译时 java 不是 1.8.0，15.1 无法编译"
            exit 1
          fi

          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true

          # ★★★ Jack server 修复（run #27 实测真因，两层）★★★
          #   现象（编译到 11%，10292/89173 个任务时）：
          #     [ 11% 10292/89173] Ensuring Jack server is installed and started
          #     FAILED: setup-jack-server
          #     Launching Jack server java -XX:MaxJavaStackTraceDepth=-1 ...
          #     Jack server failed to (re)start
          #     SSL error when connecting to the Jack server.
          #
          #   真因 ①【主因】SSL 算法被新 JDK 禁用（最关键！）
          #     Jack 用 SSL 在 client/server 间通信，keystore 是旧格式，
          #     而 JDK 8u504（Temurin 最新）默认开了
          #     `jdk.certpath.disabledAlgorithms=MD2` 和
          #     `jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, ...`
          #     → Jack 的握手被拒 → "SSL error when connecting to the Jack server"
          #     这是 Android 8.1 时代项目在新 JDK 上的【头号拦路虎】。
          #   真因 ②【次因】内存：Jack 默认堆很大，runner 仅 ~7G。
          #
          #   修法：先放开 java.security 的算法限制，再限 Jack 堆并降并发。
          JAVA_SEC="$JAVA_HOME/jre/lib/security/java.security"
          if [ -f "$JAVA_SEC" ]; then
            echo "===== 放开 JDK 安全算法限制（Jack SSL 必需）====="
            sudo cp -n "$JAVA_SEC" "$JAVA_SEC.bak" 2>/dev/null || true
            sudo sed -i 's/^jdk\.tls\.disabledAlgorithms=.*/jdk.tls.disabledAlgorithms=SSLv3/' "$JAVA_SEC" 2>/dev/null || true
            sudo sed -i 's/^jdk\.certpath\.disabledAlgorithms=.*/jdk.certpath.disabledAlgorithms=MD2/' "$JAVA_SEC" 2>/dev/null || true
            sudo sed -i 's/^jdk\.jar\.disabledAlgorithms=.*/jdk.jar.disabledAlgorithms=MD2/' "$JAVA_SEC" 2>/dev/null || true
            grep -E '^jdk\.(tls|certpath|jar)\.disabledAlgorithms' "$JAVA_SEC" 2>/dev/null || true
          else
            echo "::warning::未找到 $JAVA_SEC，跳过算法放开"
          fi

          # 内存：显式限制 Jack 堆，并关掉"吃满内存"的行为
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx3g"
          export ANDROID_JACK_VM_ARGS="$JACK_SERVER_VM_ARGUMENTS"
          export JACK_OPTIONAL_WARNINGED_ABOUT_UNSUPPORTED="true"
          export MALLOC_ARENA_MAX=4

          # 清掉上一次可能残留的 jack server
          if [ -x prebuilts/sdk/tools/jack-admin ]; then
            echo "===== 停掉旧 Jack server ====="
            ./prebuilts/sdk/tools/jack-admin kill-server 2>&1 | tail -3 || true
            rm -rf "$HOME/.jack-server" "$HOME/.jack-settings" 2>/dev/null || true
            echo "  JACK_SERVER_VM_ARGUMENTS=$JACK_SERVER_VM_ARGUMENTS"
          fi
          echo "===== 内存现状（Jack 很吃内存，留意）====="
          free -m | head -2 || true

          source build/envsetup.sh
          echo "===== 可用 lunch 目标 ====="
          lunch 2>&1 | tail -30 || true
          # ⚠️ 用 userdebug：eng 会让 build 系统往 cmdline 追加 buildvariant=eng
          echo "===== 选择 lineage_MS600-userdebug ====="
          lunch lineage_MS600-userdebug
          BUILD_TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          BUILD_JOBS="${{ github.event.inputs.jobs || '4' }}"

          # ★ 内存自适应降并发（Jack 需要留出 ≥4G 给它）
          #   免费 runner 只有约 7 GB 内存，-j4 并行 + Jack 3g 会打架。
          #   实测 run #27 用 -j4 编到 11% 就 Jack 起不来。
          MEM_MB=$(free -m | awk 'NR==2{print $2}')
          echo "  总内存 = ${MEM_MB} MB"
          if [ "${MEM_MB:-0}" -lt 9000 ]; then
            echo "::warning::内存 <9G，自动把并行度从 ${BUILD_JOBS} 降到 2（给 Jack server 让路）"
            BUILD_JOBS=2
          fi
          # ---- ★ 省磁盘的关键设置 ----
          export WITH_DEXPREOPT=false
          export DONT_DEXPREOPT_PREBUILTS=true
          export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
          echo "===== 开始编译：mka ${BUILD_TARGET} -j${BUILD_JOBS} ====="
          (
            while true; do
              sleep 300
              AVAIL=$(df -m / | awk 'NR==2{print $4}')
              PROG=$(grep -oE '\[ *[0-9]+% [0-9]+/[0-9]+\]' ~/lineage/build.log 2>/dev/null | tail -1)
              OUTSZ=$(du -sm ~/lineage/out 2>/dev/null | cut -f1)
              echo "- [$(date -u +%H:%M:%S)] 进度:$PROG | out:${OUTSZ}MB | 剩余磁盘:${AVAIL}MB" >> $GITHUB_STEP_SUMMARY
              if [ "${AVAIL:-999999}" -lt 3072 ]; then
                echo "::error::⚠️ 磁盘不足 3G！即将爆盘"
              fi
            done
          ) &
          HEARTBEAT_PID=$!
          set -o pipefail
          mka "${BUILD_TARGET}" -j"${BUILD_JOBS}" 2>&1 | tee ~/lineage/build.log
          RC=${PIPESTATUS[0]}
          kill $HEARTBEAT_PID 2>/dev/null || true
          echo "===== 编译退出码: ${RC} ====="
          du -sh ~/lineage/out 2>/dev/null || true
          df -h /
          exit $RC

      # -----------------------------------------------------------------
      - name: ⑬ 磁盘与产物概览
        if: always()
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== 产物 ====="
          find ~/lineage/out/target/product -maxdepth 2 -type f \( -name '*.img' -o -name '*.zip' \) -exec ls -lh {} \; 2>/dev/null || echo "(无产物)"

      # -----------------------------------------------------------------
      - name: ⑭ 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-15.1
          path: ~/lineage/build.log
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------
      - name: ⑮ 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-15.1-MS600-output
          path: |
            ~/lineage/out/target/product/MS600/*.img
            ~/lineage/out/target/product/MS600/*.zip
          if-no-files-found: warn
          retention-days: 14
