name: Build LineageOS 18.1 for MS600

# =============================================================================
#  讯飞听见 L1（MS600）LineageOS 18.1（Android 11）云编译
#
#  设备事实（全部本机实测）：
#    平台 msm8953 / SDM450 · 内核 3.18.71-perf（prebuilt）· A-only
#    system 3GB / vendor 1GB / boot 64MB / recovery 64MB
#    bootloader 已解锁（verifiedbootstate=orange）
#
#  与 TWRP 工程的关键差异（不要照搬 TWRP 的 workflow）：
#    ✗ 不要装 python2.7 —— Android 11 的构建脚本是 Python 3
#    ✗ 不要装 python-is-python3 之外的 python 覆盖
#    ✓ JDK 必须 11（Android 11 要求），不是 JDK 8
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '编译目标（recoveryimage / bootimage / snod / systemimage / bacon）'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - recoveryimage
          - bootimage
          - snod
          - systemimage
          - vantage
          - bacon
      jobs:
        description: '并行编译任务数（内存吃紧就调小）'
        required: true
        default: '4'
        type: string
      sync_only:
        description: '只同步源码不编译（验证 sync 可行性）'
        required: true
        default: false
        type: boolean
      clean_source:
        description: '源码树清理：auto=智能保留（增量同步，1~3分钟）；force=强制清空重下（源码树损坏时用，约77分钟）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - force
      runner:
        description: '运行器：github=免费云机器（146G磁盘，编不了systemimage）；self-hosted=自建云服务器（需先配好）'
        required: true
        default: 'github'
        type: choice
        options:
          - github
          - self-hosted
  push:
    # ⚠️ 已【关闭】push 自动触发（2026-10-01 事故）：
    #   push + concurrency.cancel-in-progress 的组合，会让【每次推送 workflow
    #   或设备树】都启一个新 run，把正在跑的编译顶掉、并烧掉一次昂贵构建。
    #   需要跑编译时：Actions 页面手动 Run workflow（可指定 build_target）。
    branches-ignore:
      - '**'

concurrency:
  # 同一分支只保留最新一次运行；新运行会自动顶掉排队中/执行中的旧运行。
  # （逐文件推送会触发多次运行，靠这个开关自动收敛，无需手工取消）
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LineageOS 18.1 / MS600
    # ⚠️ 动态运行器：push 事件时 inputs 为空 → 兜底 github。
    #    写法说明：GitHub 表达式是【短路求值】，条件为假时不会求值 fromJSON，
    #    因此 push 触发也安全。自建 runner 标签须与 setup_builder.sh 的 --labels 一致。
    #    （等价于 github.event.inputs.runner == 'self-hosted' ? [self-hosted,...] : ubuntu-22.04）
    runs-on: ${{ fromJSON(github.event.inputs.runner == 'self-hosted'
             && '["self-hosted","linux","x64","builder"]'
             || '"ubuntu-22.04"') }}
    timeout-minutes: 355

    steps:
      # -----------------------------------------------------------------
      - name: ① 检出本工程
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      - name: ② 探测 Runner 规格（决定后续并行度）
        run: |
          echo "================ CPU ================"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core' || true
          echo "================ 内存 ================"
          free -h
          echo "================ 磁盘（清理前）================"
          df -h /

      # -----------------------------------------------------------------
      # ⚠️ 仅在 GitHub 免费 runner 上执行清理。
      #    自建云服务器上这一步【必须跳过】——那里磁盘是自己买的 300G+，
      #    而且预装的编译依赖（JDK/工具链）正是我们需要的，删了就白装了。
      - name: ③ 释放磁盘空间（★ 尽力清理，仅免费 runner）
        if: ${{ github.event.inputs.runner != 'self-hosted' }}
        run: |
          echo "清理前："; df -h /
          # --- GitHub runner 预装的大件（与 Android 编译无关）---
          sudo rm -rf /usr/share/dotnet                || true
          sudo rm -rf /usr/local/lib/android           || true
          sudo rm -rf /opt/ghc                         || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL      || true
          sudo rm -rf /usr/local/share/boost           || true
          sudo rm -rf /usr/local/share/powershell      || true
          sudo rm -rf /usr/share/swift                 || true
          sudo rm -rf /usr/local/.ghcup                || true
          sudo rm -rf /usr/local/lib/node_modules      || true
          # --- 本轮新增：更激进的清理 ---
          sudo rm -rf /opt/hostedtoolcache             || true   # 工具缓存（JDK 之外）
          sudo rm -rf /usr/share/java                  || true
          sudo rm -rf /usr/share/gradle                || true
          sudo rm -rf /usr/local/share/chromium        || true
          sudo rm -rf /usr/local/share/edge*           || true
          sudo rm -rf /opt/microsoft                   || true
          sudo rm -rf /usr/share/miniconda             || true
          sudo rm -rf /usr/share/R                    || true
          sudo rm -rf /opt/az                          || true
          sudo rm -rf /usr/local/aws-cli               || true
          sudo rm -rf /opt/google/chrome              || true
          sudo rm -rf /usr/lib/firefox                 || true
          sudo rm -rf /usr/share/doc                   || true
          sudo rm -rf /usr/share/man                   || true
          # swap 文件（编译不需要）
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          # --- 包管理与容器 ---
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*             || true
          sudo docker image prune -a -f                || true
          sudo docker system prune -a -f --volumes     || true
          echo "清理后："; df -h /
          echo "::notice::③ 清理完成"

      # -----------------------------------------------------------------
      - name: ④ 安装 JDK 11（Android 11 必需；自建机器已预装则跳过）
        if: ${{ github.event.inputs.runner != 'self-hosted' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # -----------------------------------------------------------------
      - name: ⑤ 安装编译依赖（自建机器已预装则跳过）
        if: ${{ github.event.inputs.runner != 'self-hosted' }}
        run: |
          sudo apt-get update -qq
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev \
                liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
                pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
                libncurses5-dev libncurses5 lib32ncurses5-dev"
          if ! sudo apt-get install -y $PKGS; then
            echo "::warning::整批安装失败，改为逐个安装（个别包在 22.04 已改名，可忽略）"
            for p in $PKGS; do
              sudo apt-get install -y "$p" || echo "::warning::跳过缺失包: $p"
            done
          fi

      # -----------------------------------------------------------------
      - name: ⑥ 配置 git 与 repo 工具
        run: |
          git config --global user.name  "MS600 Builder"
          git config --global user.email "builder@ms600.local"
          git config --global color.ui    false
          git config --global core.compression 0

          # ★★★ 国内服务器关键配置（2026-10-01 二次修复）★★★
          #   LineageOS 18.1 源码分散在两处，【两个都要重写】，缺一不可：
          #     ① github.com/LineageOS/*            → 清华 lineageOS 镜像
          #     ② android.googlesource.com/platform/* → 清华 AOSP 镜像
          #     ③ gerrit.googlesource.com/git-repo   → 清华 git-repo 镜像
          #
          #   ★ run #29 失败真因（实测日志）：
          #     fatal: unable to access
          #       'https://android.googlesource.com/platform/compatibility/cdd/':
          #       Failed to connect to android.googlesource.com port 443
          #       after 130958 ms: Connection timed out
          #   上一轮只重写了 ①，漏了 ②③ → 每次 sync 到 AOSP 仓库就超时 130 秒。

          MIRROR_BASE="https://mirrors.tuna.tsinghua.edu.cn/git"

          # ★★★ 先清理历史残留（自建 runner 的 ~/.gitconfig 是【持久】的）★★★
          #   run #35 实测：规则条数 = 16（不是 5），因为上一轮的旧规则还在。
          #   不清干净 → 旧的错误 lineageOS 重写会一直污染，且条数校验永远失败。
          #   ★ 注意 --add 只会【追加】，所以必须显式清理，否则规则无限累积！
          echo "===== 清理旧的 url.*.insteadOf 规则（保证幂等）====="
          BEFORE=$(git config --global --get-regexp 'url\..*\.insteadof' 2>/dev/null | wc -l)
          echo "  清理前规则数 = $BEFORE"
          for K in $(git config --global --get-regexp 'url\..*\.insteadof' 2>/dev/null \
                     | awk '{print $1}' | sort -u); do
            git config --global --unset-all "$K" 2>/dev/null || true
          done
          AFTER=$(git config --global --get-regexp 'url\..*\.insteadof' 2>/dev/null | wc -l)
          echo "  清理后规则数 = $AFTER"

          echo "===== 探测各镜像【真实可用性】（必须 HTTP 200，不能只看连通）====="
          #  ★ 教训：run #33 里 probe 用 curl -sI 只判连通，AOSP/lineageOS/git-repo
          #    三个都报 ✅，但清华【根本没有 lineageOS 镜像目录】，实际是 404。
          probe_strict() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 12 \
                   "$1/info/refs?service=git-upload-pack" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "  ✅ $2  (HTTP $code)"; return 0
            else
              echo "  ❌ $2  (HTTP $code — 不可用)"; return 1
            fi
          }
          probe_strict "$MIRROR_BASE/AOSP/platform/compatibility/cdd" "AOSP 镜像"
          probe_strict "$MIRROR_BASE/git-repo"                        "git-repo 镜像"

          echo "===== 探测 GitHub 直连（manifest 必需）====="
          if curl -s -o /dev/null -w '%{http_code}' --connect-timeout 12 \
               "https://github.com/LineageOS/android.git/info/refs?service=git-upload-pack" \
               | grep -q 200; then
            echo "::notice::✅ github.com/LineageOS 直连可用（manifest 走这里）"
          else
            echo "::warning::⚠️ github.com 直连不通 —— manifest 可能拉不下来"
          fi

          # ★★★ 镜像重写策略（2026-10-01 run #33 失败后修正）★★★
          #   实测结论（本机复现验证）：
          #     ① 清华 git/lineageOS/   → 【不存在，404】！千万别把 github.com/LineageOS
          #        重写过去，否则 repo init 直接 "repository not found"（run #33 就这么挂的）
          #     ② github.com/LineageOS/* → 【直连可用】，做 manifest 拉取毫无问题
          #     ③ git config url.X.insteadOf 重复写入【是覆盖不是追加】，必须 --add
          #        （run #29 超时、run #31 只剩 3 条规则的真因）
          #
          #   最终策略：只重写【国内确实连不通】的两个域名，GitHub 保持直连。
          #     android.googlesource.com  → 清华 AOSP      ✅ 已验证 200
          #     gerrit.googlesource.com   → 清华 git-repo   ✅ 已验证 200

          # ---- ★ android.googlesource.com → 清华 AOSP（关键）----
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://android.googlesource.com/"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://android.googlesource.com"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "git://android.googlesource.com/"

          # ---- ★ gerrit.googlesource.com → 清华 ----
          git config --global --add url."$MIRROR_BASE/git-repo".insteadOf "https://gerrit.googlesource.com/git-repo"
          git config --global --add url."$MIRROR_BASE/AOSP/".insteadOf "https://gerrit.googlesource.com/"

          # ---- GitHub 保持直连，【不做任何重写】----
          echo "  （github.com/LineageOS 保持直连 —— 清华无此镜像）"

          echo "===== 当前 insteadOf 规则（应为 5 条）====="
          git config --global --get-regexp 'url\..*\.insteadof' || true
          N=$(git config --global --get-regexp 'url\..*\.insteadof' | wc -l)
          echo "规则条数 = $N"
          if [ "$N" -lt 5 ]; then
            echo "::error::❌ insteadOf 规则只有 $N 条（期望 5），镜像重写不完整，中止"
            exit 1
          fi
          # 自我保护：确认没有把 github.com 重写走
          if git config --global --get-regexp 'url\..*\.insteadof' | grep -q 'github.com/LineageOS'; then
            echo "::error::❌ 检测到 github.com/LineageOS 被重写 —— 清华无此镜像，必失败！"
            exit 1
          fi
          echo "  ✅ 确认 github.com 未被重写"

          # ---- 网络容错：大仓库不断流 ----
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.version HTTP/1.1

          # ---- ★ repo 工具：国内【必须】走清华镜像 ----
          #   storage.googleapis.com 在国内被墙，官方一键脚本必失败（run #31 退出码 56）。
          mkdir -p ~/bin
          REPO_OK=0
          for R in "$MIRROR_BASE/git-repo" "https://mirrors.tuna.tsinghua.edu.cn/git/git-repo"; do
            echo "尝试拉取 repo 工具: $R"
            if curl -fsSL --connect-timeout 20 "$R" -o ~/bin/repo; then
              chmod a+x ~/bin/repo
              if python3 ~/bin/repo --version >/dev/null 2>&1; then
                echo "::notice::✅ repo 工具就绪（来自 $R）"
                REPO_OK=1; break
              fi
            fi
            echo "  该源不可用，换下一个"
          done
          if [ "$REPO_OK" != "1" ]; then
            echo "::error::❌ 所有 repo 工具镜像均不可用"
            exit 1
          fi
          echo "$HOME/bin" >> $GITHUB_PATH
          python3 ~/bin/repo --version

      # -----------------------------------------------------------------
      - name: ⑦ 初始化源码仓库（LineageOS 18.1）
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          export PATH="$HOME/bin:$PATH"

          # ★★★ 源码树清理策略（2026-10-01 第二次修订）★★★
          #   历史教训：
          #     run #37/#38 报 `SyncFailFastError: checkout <SHA>`，根因是
          #     【工作树与 .repo 状态不一致】（上一轮失败留下的残缺工作树 + 新 .repo）。
          #     当时的修法是"无条件 rm -rf ~/lineage"，确实治好了病，
          #     但代价是**每轮都全量重下**（18.1 约 77 分钟 / 103G）。
          #
          #   ★ 现在的策略：【默认保留，只在确认损坏时才清空】
          #     repo sync 本身是增量的 —— 源码树完好时补齐差异只要 1~3 分钟。
          #     只有下面三种情况才需要全量重建：
          #       ① 从没同步过（没有 .repo）
          #       ② .repo 损坏（有目录但没有 manifest.xml）
          #       ③ .repo 有、工作树空 → 典型的"状态不一致"
          #
          #   想强制全量重建时：workflow_dispatch 时把 clean_source 选 force。
          CLEAN_MODE="${{ github.event.inputs.clean_source || 'auto' }}"
          echo "===== 源码树清理策略: $CLEAN_MODE ====="

          NEED_CLEAN=0
          REASON=""

          if [ "$CLEAN_MODE" = "force" ]; then
            NEED_CLEAN=1; REASON="用户显式指定 force"
          elif [ ! -d ~/lineage/.repo ]; then
            NEED_CLEAN=1; REASON="从未同步过（无 .repo）"
          elif [ ! -s ~/lineage/.repo/manifest.xml ]; then
            NEED_CLEAN=1; REASON=".repo 缺少 manifest.xml（损坏）"
          elif [ -d ~/lineage/.repo ] && [ ! -d ~/lineage/frameworks/base ]; then
            NEED_CLEAN=1; REASON=".repo 存在但工作树缺失（状态不一致）"
          fi

          if [ "$NEED_CLEAN" = "1" ]; then
            echo "::warning::需要全量重建源码树 —— 原因: $REASON"
            if [ -d ~/lineage ]; then
              du -sh ~/lineage 2>/dev/null || true
              chmod -R u+w ~/lineage 2>/dev/null || true
              rm -rf ~/lineage
            fi
          else
            echo "::notice::✅ 复用已有源码树，repo sync 将【增量】补齐（通常 1~3 分钟）"
            du -sh ~/lineage 2>/dev/null || true
            echo "  工作树目录数 = $(ls -1 ~/lineage 2>/dev/null | wc -l)"
            echo "  .repo 存在     = $([ -d ~/lineage/.repo ] && echo yes || echo no)"
          fi
          mkdir -p ~/lineage
          cd ~/lineage

          # ★★★ 国内服务器（阿里云）关键修复（2026-10-01）★★★
          #   repo 工具自身的源码托管在 gerrit.googlesource.com，国内直连【必失败】：
          #     fatal: unable to access 'https://gerrit.googlesource.com/git-repo/':
          #            Failed to connect to gerrit.googlesource.com port 443
          #   解法：--repo-url 指向【清华 TUNA git-repo 镜像】。
          #   ★ manifest 用【官方 + insteadOf 重写】最稳（清华 manifest 镜像可能不同步）。
          # ★★★ run #37 真因（实测）★★★
          #   repo sync 4 次全失败，报：
          #     Repo command failed due to the following `SyncFailFastError` errors:
          #     LineageOS/android checkout 88e370827501474db8f1905128fdea2e8128ead4
          #   → 已去掉 repo init 的 --depth=1（浅克隆 manifest 仓库无法 fetch 指定 revision）
          REPO_URL_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/git/git-repo"

          echo "===== 探测 git-repo 镜像可达性 ====="
          if curl -sI --connect-timeout 12 "$REPO_URL_MIRROR" >/dev/null 2>&1; then
            echo "::notice::✅ 清华 git-repo 镜像可达"
          else
            echo "::warning::清华镜像不可达，回退官方源（可能失败）"
            REPO_URL_MIRROR="https://gerrit.googlesource.com/git-repo"
          fi

          # ★ 用官方 manifest：其内部的 fetch URL 会被第⑥步的 insteadOf
          #   在 git 层面重写到清华镜像（github + android.googlesource 都已覆盖）。
          # ★ 单行写法（同上，YAML 里 "\" 不是续行符）
          for attempt in 1 2 3; do
            echo "===== repo init 第 ${attempt} 次 ====="
            if repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --repo-url="$REPO_URL_MIRROR" --git-lfs --no-clone-bundle; then
              echo "::notice::✅ repo init 成功"; break
            fi
            rm -rf .repo; sleep 10
            [ "$attempt" = "3" ] && { echo "::error::❌ repo init 全失败"; exit 1; }
          done

          echo "===== 校验 manifest 中的 fetch URL ====="
          if [ -f .repo/manifests/default.xml ]; then
            grep -oE 'fetch="[^"]+"' .repo/manifests/default.xml | sort -u | head
          fi
          echo "===== .repo 就绪 ====="
          ls .repo/ | head

      # -----------------------------------------------------------------
      - name: ⑧ 同步源码（★ 最耗时，实测约 11 分钟）
        run: |
          cd ~/lineage
          export PATH="$HOME/bin:$PATH"

          # ============ ★ 前置自检（防止 again 直连 Google）============
          # ★ 教训（run #36）：别用 `git config --get-urlmatch url <URL>` 验 insteadOf！
          #   实测它查的是 url.<base>.<key> 形式的配置（如 url.X.proxy），
          #   【跟 insteadOf 规则无关】，即使重写已生效也返回 exit 1 → 误报拦截。
          #   唯一可靠的验证 = 直接 git ls-remote 打一次真实流量。
          echo "===== 自检 1：insteadOf 规则抽查 ====="
          git config --global --get-regexp 'url\..*\.insteadof' | grep android.googlesource \
            && echo "  ✅ android.googlesource.com 重写规则存在" \
            || { echo "::error::❌ 缺 android.googlesource.com 重写规则"; exit 1; }

          echo "===== 自检 2：实测 AOSP 仓库连通性（真流量）====="
          TEST_URL="https://android.googlesource.com/platform/compatibility/cdd"
          echo "  测试 URL : $TEST_URL"
          if timeout 60 git ls-remote --heads "$TEST_URL" >/dev/null 2>&1; then
            echo "::notice::✅ 重写生效，AOSP 仓库可达"
          else
            echo "::error::❌ AOSP 仓库不可达 —— 中止以免空跑 1 小时"
            git config --global --get-regexp 'url\..*\.insteadof' || echo "  （无规则）"
            exit 1
          fi

          echo "===== 自检 3：manifest 源（GitHub）可达 ====="
          if timeout 60 git ls-remote --heads https://github.com/LineageOS/android.git >/dev/null 2>&1; then
            echo "::notice::✅ github.com/LineageOS 直连可用"
          else
            echo "::warning::⚠️ GitHub 直连不通，continue 但 sync 可能失败"
          fi
          echo "=================================================="

          # 国内网络：降低并发、加大超时，失败自动重试
          # ★ 用【最朴素】的参数：
          #   去掉 --no-tags（manifest 检出可能要 tag）
          #   去掉 --retry-fetches / --fail-fast（避免与 checkout 逻辑互相干扰）
          set +e
          RC=1
          for i in 1 2 3; do
            echo "===== repo sync 第 $i 次尝试 ====="
            repo sync -c -j4 --force-sync --no-clone-bundle
            RC=$?
            if [ $RC -eq 0 ]; then
              echo "::notice::✅ repo sync 成功"
              break
            fi
            echo "::warning::repo sync 失败（exit $RC），清理锁并重试..."
            echo "----- 诊断：manifest 仓库 -----"
            ( cd .repo/manifests 2>/dev/null && \
              echo "  HEAD: $(git rev-parse HEAD 2>&1)" && \
              echo "  浅克隆: $(git rev-parse --is-shallow-repository 2>&1)" && \
              git log --oneline -2 2>&1 ) || echo "  .repo/manifests 不可读"
            echo "----- 诊断：工作树与 .repo 时间戳 -----"
            ls -ld .repo 2>/dev/null; ls -ld bootable frameworks system 2>/dev/null | head
            find .repo -name '*.lock' -delete 2>/dev/null || true
            sleep 20
          done

          echo "===== 源码体积 ====="
          du -sh ~/lineage 2>/dev/null || true
          df -h /

          if [ $RC -ne 0 ]; then
            echo "::error::❌ repo sync 连续 4 次失败，中止"
            exit 1
          fi

      # -----------------------------------------------------------------
      - name: ⑨ 放入 MS600 设备树
        run: |
          cd ~/lineage
          mkdir -p device/iflytek/MS600
          cp -rv "$GITHUB_WORKSPACE/device/iflytek/MS600/." device/iflytek/MS600/
          echo "===== 设备树内容 ====="
          find device/iflytek/MS600 -type f | sort

      # -----------------------------------------------------------------
      - name: ⑩ 结束（sync_only 模式）
        if: ${{ github.event.inputs.sync_only == 'true' }}
        run: |
          echo "::notice::sync_only 模式，跳过编译"
          df -h /

      # -----------------------------------------------------------------
      # ⚠️ 实测 2026-10-01：ccache 对 systemimage **弊大于利**
      #   - 缓存自身要占 20G+，而磁盘本来就不够
      #   - 本项目每次都是"从零编一个新目标"，缓存命中率极低
      #   → 已【关闭 ccache】，改为纯磁盘监控
      #
      # 已确认的 systemimage 磁盘需求（run 36758761289 实测）：
      #   sync 后 32G → 编到 50% 时消耗 86G → 146G 撑爆
      #   推算 100% 需 ~170G，**超出免费 runner 上限**
      - name: ⑪ 编译（lunch + mka，带磁盘心跳监控）
        if: ${{ github.event.inputs.sync_only != 'true' }}
        run: |
          cd ~/lineage
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true

          # ★★★ 编译前属主自检（run #39 教训，见技能 5.6）★★★
          #   run #39 编到 38% 报：
          #     error: unable to open output file '...AsmWriter.o': 'Permission denied'
          #   真因：out/ 下有 root 属主的中间目录（曾用 root 跑过 ninja 类命令），
          #         而编译以 ghrunner 跑 → 撞权限。
          #   这里做幂等保险：发现非本用户的文件就改回来。
          MYUID=$(id -u); MYGID=$(id -g)
          echo "===== 编译前属主自检（当前用户 uid=$MYUID gid=$MYGID）====="
          if [ -d ~/lineage/out ]; then
            BAD=$(find ~/lineage/out ! -user "$MYUID" 2>/dev/null | wc -l)
            echo "  非本用户文件数 = $BAD"
            if [ "$BAD" -gt 0 ]; then
              echo "::warning::检测到 $BAD 个非本用户文件，自动修正属主"
              sudo chown -R "$MYUID:$MYGID" ~/lineage/out 2>/dev/null || \
                chown -R "$MYUID:$MYGID" ~/lineage/out 2>/dev/null || true
              BAD2=$(find ~/lineage/out ! -user "$MYUID" 2>/dev/null | wc -l)
              echo "  修正后剩余 = $BAD2"
              [ "$BAD2" -gt 0 ] && echo "::warning::仍有 $BAD2 个无法修正，可能编译仍失败"
            fi
          else
            echo "  out/ 尚不存在，跳过"
          fi

          source build/envsetup.sh
          echo "===== 可用 lunch 目标 ====="
          lunch 2>&1 | tail -30 || true
          # ⚠️ 必须用 userdebug，不能用 eng！
          #    eng 变体会让 build 系统往 cmdline 末尾追加 `buildvariant=eng`，
          #    覆盖掉 DTB / BoardConfig 里的 `buildvariant=user`
          #    （实测 2026-09-30 第二轮 boot.img 的 cmdline：
          #       ... buildvariant=user buildvariant=eng   ← 末尾是 eng，错的）
          #    后果：ro.build.type=eng、adb 默认 root、性能偏慢，不符合真实产品形态。
          #    userdebug = 可调试 + 性能正常；user = 正式版（但无法 adb root 调试）。
          echo "===== 选择 lineage_MS600-userdebug ====="
          lunch lineage_MS600-userdebug
          # ⚠️ push 事件触发时 github.event.inputs.* 为空 → 必须给默认值兜底，
          #    否则会变成 `mka  -j`（无目标 = 编整个 ROM，烧光 6 小时额度）
          BUILD_TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          BUILD_JOBS="${{ github.event.inputs.jobs || '4' }}"
          # ---- ★ 省磁盘的关键设置 ----
          #  1) 关闭各种"顺手产出"的调试产物
          export WITH_DEXPREOPT=false        # 不做 dex 预优化（很吃磁盘）
          export DONT_DEXPREOPT_PREBUILTS=true
          export WITH_TWRP=false
          #  2) 关掉 javac 的静态分析产物目录
          export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
          #  3) 不生成 symbols（每个模块的 .debug 文件能占几十 G）
          export TARGET_KERNEL_NO_MODULES=true
          echo "===== 开始编译：mka ${BUILD_TARGET} -j${BUILD_JOBS} ====="
          # ---- 看门狗：每 5 分钟记录 进度 + 剩余磁盘 ----
          #      磁盘低于 3G 时告警（便于事后判断是否死于爆盘）
          (
            while true; do
              sleep 300
              AVAIL=$(df -m / | awk 'NR==2{print $4}')
              PROG=$(grep -oE '\[ *[0-9]+% [0-9]+/[0-9]+\]' ~/lineage/build.log 2>/dev/null | tail -1)
              OUTSZ=$(du -sm ~/lineage/out 2>/dev/null | cut -f1)
              echo "- [$(date -u +%H:%M:%S)] 进度:$PROG | out:${OUTSZ}MB | 剩余磁盘:${AVAIL}MB" >> $GITHUB_STEP_SUMMARY
              if [ "${AVAIL:-999999}" -lt 3072 ]; then
                echo "::error::⚠️ 磁盘不足 3G！即将爆盘"
              fi
            done
          ) &
          HEARTBEAT_PID=$!
          set -o pipefail
          mka "${BUILD_TARGET}" -j"${BUILD_JOBS}" 2>&1 | tee ~/lineage/build.log
          RC=${PIPESTATUS[0]}
          kill $HEARTBEAT_PID 2>/dev/null || true
          echo "===== 编译退出码: ${RC} ====="
          echo "===== out/ 最终体积 ====="
          du -sh ~/lineage/out 2>/dev/null || true
          df -h /
          exit $RC

      # -----------------------------------------------------------------
      - name: ⑫ 磁盘与产物概览
        if: always()
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== 产物 ====="
          find ~/lineage/out/target/product -maxdepth 2 -type f \( -name '*.img' -o -name '*.zip' \) -exec ls -lh {} \; 2>/dev/null || echo "(无产物)"

      # -----------------------------------------------------------------
      # ⚠️ 路径用 $HOME 而非硬编码 /home/runner：
      #    免费 runner 的 HOME=/home/runner，自建 runner 的 HOME=/home/ghrunner
      - name: ⑬ 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/lineage/build.log
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------
      - name: ⑭ 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-MS600-output
          path: |
            ~/lineage/out/target/product/MS600/*.img
            ~/lineage/out/target/product/MS600/*.zip
          if-no-files-found: warn
          retention-days: 14
